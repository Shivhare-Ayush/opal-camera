name: Opal
options:
  bundleIdPrefix: dev.ayush
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: "${OPAL_TEAM}"
    CODE_SIGN_STYLE: Automatic
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ENABLE_PREVIEWS: "NO"
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: "NO"
    ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: "NO"
targets:
  Opal:
    type: application
    platform: iOS
    sources:
      - Sources
    info:
      path: Resources/Info.plist
      properties:
        CFBundleIdentifier: ${OPAL_BUNDLE:-dev.ayush.opal}
        CFBundleDisplayName: Opal
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Dark
        NSCameraUsageDescription: Opal needs camera access to display real-time color graded viewfinder previews.
        NSPhotoLibraryAddUsageDescription: Opal needs photo library access to save finished graded photos to the LiveGraded Photos album.
        NSPhotoLibraryUsageDescription: Opal needs photo library access to manage the dedicated test album and save your photos.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${OPAL_BUNDLE:-dev.ayush.opal}
        TARGETED_DEVICE_FAMILY: "1"
